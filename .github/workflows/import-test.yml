# TEMPORARY: read-only dry runs of the Spotify → Apple import, for testing the
# feature branch before import.yml is on main. Reads Spotify and (with the Apple user
# token) reads the Apple library, but never writes to it; no issues, no commits.
# Delete before merging.
name: Import dry-run test (temporary)

on:
  push:
    branches: [feature/spotify-import]
    paths:
      - ".github/workflows/import-test.yml"
      - "apple_client.py"
      - "apple_match.py"
      - "spotify_to_apple.py"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: year-end
            url: "https://open.spotify.com/playlist/37i9dQZF1ELZKwZesMj5rm"
          - label: user-made
            url: "https://open.spotify.com/playlist/3SAREm1ft0Fdi4T9no6gzO"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Smoke test (Apple catalog + library, read-only)
        env:
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
        run: python3 smoke_test.py --import --library || echo "EXIT CODE $?"

      - name: Diagnose the Apple user token (read-only, never prints it)
        env:
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
        run: |
          python3 - <<'EOF' || true
          import os, re, requests
          from apple_music import AM_BASE, HEADERS_TEMPLATE, _scrape_apple_token
          raw = os.environ.get("APPLE_MUSIC_USER_TOKEN", "")
          tok = raw.strip().strip('"').strip("'").strip()
          has_space = bool(re.search(r"\s", tok))
          base64ish = bool(re.fullmatch(r"[A-Za-z0-9+/=_-]+", tok))
          print(f"secret length {len(raw)}, cleaned length {len(tok)}, "
                f"whitespace inside: {has_space}, "
                f"looks like a JWT/developer token: {tok.startswith('eyJ')}, "
                f"only base64-ish chars: {base64ish}")
          dev = _scrape_apple_token()
          base = {**HEADERS_TEMPLATE, "Authorization": f"Bearer {dev}"}
          variants = {
              "Music-User-Token only": {"Music-User-Token": tok},
              "media-user-token only": {"media-user-token": tok},
              "both + Referer": {"Music-User-Token": tok, "media-user-token": tok,
                                 "Referer": "https://music.apple.com/"},
              "media-user-token + cookie": {"media-user-token": tok,
                                            "Cookie": f"media-user-token={tok}"},
          }
          for label, extra in variants.items():
              for path in ("/v1/me/library/playlists?limit=1", "/v1/me/storefront"):
                  r = requests.get(AM_BASE + path, headers={**base, **extra}, timeout=20)
                  body = r.text[:300].replace(tok, "<token>").replace(dev, "<dev>")
                  print(f"{label:28} {path:36} -> {r.status_code} {body}")
          EOF

      - name: Dry run (normal, seeded cache, reads the Apple library)
        env:
          SPOTIFY_URL: ${{ matrix.url }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python3 spotify_to_apple.py "$SPOTIFY_URL" --dry-run --save-text || echo "EXIT CODE $?"
          mkdir -p out && cp reports/import_review.json out/normal.json || true
          cp cache/reverse_mapping.json out/reverse_normal.json || true

      - name: Dry run (fresh, no cache, to test the matcher itself)
        env:
          SPOTIFY_URL: ${{ matrix.url }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          cp cache/track_mapping.json out/track_mapping_known.json
          rm -f cache/reverse_mapping.json cache/track_mapping.json cache/import_*.json
          python3 spotify_to_apple.py "$SPOTIFY_URL" --dry-run || echo "EXIT CODE $?"
          cp reports/import_review.json out/fresh.json || true
          cp cache/reverse_mapping.json out/reverse_fresh.json || true

      - name: Summary
        run: |
          python3 - <<'EOF'
          import json, glob
          from pathlib import Path
          out = Path("out")
          for kind in ("normal", "fresh"):
              p = out / f"{kind}.json"
              if not p.exists():
                  print(f"== {kind}: no report"); continue
              r = json.loads(p.read_text())
              sp = r.get("spotify_playlist", {})
              print(f"== {kind}: {sp.get('name')!r} basic_info={sp.get('basic_info')} "
                    f"total={r.get('total')} resolved={r.get('resolved')} "
                    f"unmatched={len(r.get('unmatched', []))} uncertain={len(r.get('uncertain', []))} "
                    f"featured={len(r.get('featured', []))} "
                    f"apple_playlist={r.get('apple_playlist')} "
                    f"error={r.get('error')!r}")
              for t in r.get("unmatched", []):
                  print(f"   UNMATCHED #{t['position']}: {t['name']} — {t['artist']} ({t.get('album','')})")
              for f in r.get("featured", []):
                  s, pk = f["spotify"], f["picked"]
                  print(f"   FEATURED #{s['position']}: {s['name']} — {s['artist']} -> "
                        f"{pk['name']} — {pk['artist']} [{pk['album']}] score {pk['score']} "
                        f"(without featured {f['score_without_featured']})")
              for u in r.get("uncertain", []):
                  s, pk = u["spotify"], u["picked"]
                  print(f"   UNCERTAIN #{s['position']}: {s['name']} — {s['artist']} -> "
                        f"{pk['name']} — {pk['artist']} [{pk['album']}] score {pk['score']}")
          # Matcher accuracy: fresh picks vs the weekly sync's known Apple↔Spotify pairs.
          known_path, fresh_path = out / "track_mapping_known.json", out / "reverse_fresh.json"
          if known_path.exists() and fresh_path.exists():
              known = {}
              for apple_id, uri in json.loads(known_path.read_text()).items():
                  known.setdefault(uri.rsplit(":", 1)[-1], set()).add(apple_id)
              fresh = json.loads(fresh_path.read_text())
              both = [t for t in fresh if t in known]
              agree = [t for t in both if fresh[t] in known[t]]
              print(f"== matcher check: {len(agree)}/{len(both)} fresh picks equal the weekly sync's Apple ID")
              for t in both:
                  if fresh[t] not in known[t]:
                      print(f"   DIFFERS spotify {t}: fresh apple {fresh[t]} vs known {sorted(known[t])}")
          for txt in glob.glob("exports/*.txt"):
              print(f"== backup {txt}:")
              print(Path(txt).read_text())
          EOF

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: import-test-${{ matrix.label }}
          path: |
            out/
            exports/
          if-no-files-found: ignore
